name: equipment-maintenance

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      APP_PGUSER: ${APP_PGUSER}
      APP_PGPASSWORD: ${APP_PGPASSWORD}
      APP_DB_NAME_TEST: ${PGDATABASE_TEST}
    ports:
      - '127.0.0.1:${PGPORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PGHOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PGHOST: db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  tls-init:
    image: alpine/openssl:latest
    entrypoint: ['/bin/sh', '/scripts/generate-cert.sh']
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    volumes:
      - ./deploy/nginx/generate-cert.sh:/scripts/generate-cert.sh:ro
      - tls-certs:/certs

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/errors:/etc/nginx/errors:ro
      - tls-certs:/etc/nginx/tls:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-check-certificate', '-qO-', 'https://localhost/api/health/live']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  tls-certs:
