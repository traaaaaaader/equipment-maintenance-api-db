user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  server_tokens off;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","host":"$host","request":"$request",'
    '"status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json_combined;

  sendfile        on;
  client_max_body_size 1m;

  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  gzip_min_length 512;

  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

  upstream api_upstream {
    zone api_upstream_zone 64k;
    server api:3000 resolve;
    resolver 127.0.0.11 valid=10s;

    keepalive 32;
    keepalive_timeout 60s;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Request-ID $request_id always;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    error_page 502 /_errors/502.json;
    error_page 503 /_errors/503.json;
    error_page 504 /_errors/504.json;

    location ^~ /_errors/ {
      internal;
      alias /etc/nginx/errors/;
      types { }
      default_type application/json;
    }

    location /api/ {
      limit_req zone=api_zone burst=40 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;

      proxy_pass http://api_upstream;
    }

    location = / {
      return 302 /api/docs;
    }
  }
}
